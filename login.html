<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />


    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* font-part */
        .poppins-regular {
            font-family: "Poppins", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        .josefin-sans {
            font-family: "Josefin Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }

        .playfair-display {
            font-family: "Playfair Display", serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }


        /* Animation part */

        .content-animate {
            opacity: 0;
            transform: translateY(65px);
            transition: all 0.9s ease-in-out;
        }

        .content-active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <header>
        <!-- navbar added here-->
        <div id="navbar"></div>


    </header>
    <section id="about" class="relative">
        <!-- Background Image -->
        <div class="absolute inset-0">
            <img src="./images/background/top-view-baked-potatoes-with-cooked-vegetables-dark-desk_140725-79584.jpg"
                class="w-full h-full object-cover" alt="">
            <div class="absolute inset-0 bg-black/60"></div>
        </div>

        <!-- Content box -->
        <div class="relative z-10 max-w-[90%] mx-auto py-12 md:py-20">
            <div class="bg-[#fcfcfc] border border-green-500 rounded-md p-6 md:p-10 flex flex-col gap-10">

                <!-- login Section -->
                <div class="text-center flex flex-col items-center gap-3 mt-[10vh]">
                    <span class="text-xl font-bold uppercase">Welcome Back</span>
                    <h4 class="playfair-display text-3xl md:text-5xl font-extrabold">Login</h4>
                    <span class="text-[#b9bfc0] josefin-sans">
                        Sign in to your account to continue and manage your orders
                    </span>
                </div>

                <!-- login page -->
                <div class="flex flex-col md:flex-row justify-between gap-3 mt-8 w-full">

                    <!-- Login Form -->
                    <div class="w-full md:w-[65%] rounded-md shadow-md px-3 md:px-4 py-4">

                        <!-- Header -->
                        <div class="flex flex-col gap-2">
                            <h4 class="text-3xl font-bold playfair-display">Login Account</h4>
                            <span class="text-md josefin-sans text-[#6b7280]">
                                Welcome back! Please login to your account
                            </span>
                        </div>

                        <div class="border-b-2 border-dotted border-[#c5cacc] my-5"></div>

                        <!-- Login Fields -->
                        <div class="flex flex-col gap-3">

                            <input type="email" placeholder="Email Address"
                                class="px-3 py-3 rounded-md border-2 border-[#c5cacc] outline-none josefin-sans" />

                            <input type="password" placeholder="Password"
                                class="px-3 py-3 rounded-md border-2 border-[#c5cacc] outline-none josefin-sans" />

                        </div>

                        <!-- Options -->
                        <div class="flex justify-between items-center mt-4 josefin-sans text-sm">

                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="accent-[#fe7f32]">
                                Remember me
                            </label>

                            <a href="./forgot-password.html" class="transition-all duration-300 hover:text-[#fe7f32]">
                                Forgot password?
                            </a>
                        </div>

                        <div class="border-b-2 border-dotted border-[#c5cacc] my-5"></div>

                        <!-- Actions -->
                        <div class="flex flex-col md:flex-row justify-between items-center gap-3">

                            <a href="./register.html" class="text-lg josefin-sans transition-all duration-300
                       hover:text-[#fe7f32] hover:-translate-x-1">
                                ← Create new account
                            </a>

                            <button class="bg-[#fe7f32] px-6 py-3 rounded-md text-white text-lg josefin-sans
                       transition-all duration-300
                       hover:bg-[#e86f28] hover:scale-105 hover:shadow-lg
                       active:scale-95">
                                Login
                            </button>
                        </div>

                    </div>

                    <!-- Info Card -->
                    <div class="w-full md:w-[35%] rounded-md shadow-md px-4 py-5">

                        <h4 class="uppercase josefin-sans font-bold text-base">
                            Account Benefits
                        </h4>

                        <div class="border-b-2 border-dotted border-[#c5cacc] my-4"></div>

                        <ul class="flex flex-col gap-3 josefin-sans text-md">
                            <li>✔ Faster checkout</li>
                            <li>✔ Track your orders</li>
                            <li>✔ Save your details</li>
                            <li>✔ Exclusive offers</li>
                        </ul>

                    </div>

                </div>
        

                <div class="border-b-4 border-dotted border-[#c5cacc]"></div>

               

            </div>
        </div>
    </section>
    <!-- footer added -->
    <div id="footer"></div>

    <!-- footer script -->
    <script>
        fetch("./includes/footer.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("footer").innerHTML = html;
            });
    </script>

    <script src="./includes/main.js"></script>

    <script>
        fetch("./includes/navbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("navbar").innerHTML = html;

                // ✅ SAFE CALL
                if (typeof initMobileMenu === "function") {
                    initMobileMenu();
                } else {
                    console.error("initMobileMenu not found");
                }
            });
    </script>
</body>

</html>
